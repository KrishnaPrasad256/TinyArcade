[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM13
monitor_port = COM13

lib_deps =
  adafruit/Adafruit SSD1306@^2.5.8
  adafruit/Adafruit GFX Library@^1.11.4

build_flags =
  -DSSD1306_128_64
  -DARDUINO=10805
  -DARCADE_BUZZER_PIN=10
  -Iinclude
